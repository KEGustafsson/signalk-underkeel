name: Publish to GitHub Packages

# Test, build, pack and upload the plugin tarball. Triggered manually via
# workflow_dispatch. The package name is rewritten to the repository owner's
# scope (for example @kegustafsson/signalk-underkeel) so snapshots never clash
# with the canonical unscoped package name used for public releases.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive scope (repository owner, lowercased)
        id: scope
        run: |
          echo "scope=@${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "package=@${GITHUB_REPOSITORY_OWNER,,}/signalk-underkeel" >> "$GITHUB_OUTPUT"

      - name: Check for package-lock.json
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: ${{ steps.scope.outputs.scope }}
          cache: ${{ steps.lockfile.outputs.exists == 'true' && 'npm' || '' }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ steps.lockfile.outputs.exists }}" = "true" ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check:ts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Release documentation and package truth
        run: npm run check:release-docs

      - name: Rewrite package name for GitHub Packages
        run: npm pkg set name='${{ steps.scope.outputs.package }}'

      - name: Pack tarball
        id: pack
        run: |
          PACKED_TGZ="$(npm pack | tail -n 1)"
          echo "packed_tgz=${PACKED_TGZ}" >> "$GITHUB_OUTPUT"

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signalk-underkeel
          path: ${{ steps.pack.outputs.packed_tgz }}
          if-no-files-found: error
          retention-days: 1
