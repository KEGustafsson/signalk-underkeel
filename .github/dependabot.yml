# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # @types/node tracks the lowest supported Node major (package.json
      # engines, matching signalk-server). Raise it together with engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @typescript-eslint 8.x accepts typescript >=4.8.4 <6.1.0. Drop this
      # once a typescript-eslint release widens that peer range.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
  # Keep SHA-pinned GitHub Actions (see .github/workflows/) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
