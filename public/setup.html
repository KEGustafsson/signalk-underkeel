<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Under-keel setup</title>
    <style>
      :root {
        --ink: #12233a; --muted: #4a5b70; --line: #d5dce5; --field: #b8c3d1; --accent: #1f5fa8;
        --accent-soft: #eaf2fb; --page: #ffffff; --panel: #f6f8fb; --water: #dcebf7; --bed: #b9a98f;
        --ok: #1a7340; --warn: #8a4b00; --todo: #b5261a; --margin: #e66101; --margin-ink: #a84300;
        --note: #fff4e5; --note-line: #f0c27a; --note-ink: #5c3300; --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e6edf5; --muted: #a9b6c6; --line: #33414f; --field: #4b5b6c; --accent: #6ea8ef;
          --accent-soft: #1b2c42; --page: #121a23; --panel: #1a2430; --water: #173049; --bed: #5d5243;
          --ok: #6fcf97; --warn: #f2b25c; --todo: #ff8a80; --margin: #ff9d4d; --margin-ink: #ffb27a;
          --note: #3a2a12; --note-line: #7a5420; --note-ink: #f6d7a8; --on-accent: #0b1520;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--page); }
      .back { padding: 10px 16px 0; font-size: 14px; }
      .back a { display: inline-flex; align-items: center; min-height: 44px; }
      .progress { display: flex; gap: 6px; padding: 12px 16px 0; }
      .progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
      .progress span.on { background: var(--accent); }
      .steps { display: flex; justify-content: space-between; padding: 6px 16px 0; font-size: 12px; color: var(--muted); }
      .steps .on { color: var(--accent); font-weight: 600; }
      main { padding: 0 16px 16px; }
      h2 { margin: 14px 0 4px; font-size: 19px; }
      p.lead { margin: 0 0 10px; color: var(--muted); }
      .drawing { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: none; }
      .drawing svg { display: block; width: 100%; height: auto; }
      .handle { cursor: ns-resize; }
      .handle.free { cursor: move; }
      .handle:focus { outline: none; }
      .handle:focus-visible circle { stroke-width: 4; }
      .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field label { font-weight: 500; font-size: 13px; }
      .unit { display: flex; align-items: center; border: 1px solid var(--field); border-radius: 6px; height: 44px; padding: 0 10px; background: var(--page); }
      .unit input { flex: 1; min-width: 0; border: 0; font: 500 16px ui-monospace, monospace; color: var(--ink); background: transparent; }
      .unit input:focus { outline: none; }
      .unit:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
      .hint { font-size: 12px; color: var(--muted); }
      .hint.ok { color: var(--ok); }
      .choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
      button { font: inherit; color: inherit; }
      .choice button, .card { min-height: 48px; border: 1px solid var(--field); background: var(--page); border-radius: 8px; text-align: left; padding: 8px 10px; cursor: pointer; }
      .choice button[aria-pressed="true"], .card.on { border: 2px solid var(--accent); background: var(--accent-soft); }
      .choice small, .card small { display: block; font-size: 12px; color: var(--muted); }
      .facts { margin-top: 12px; padding: 10px 12px; background: var(--panel); border-radius: 8px; font-size: 13px; color: var(--muted); }
      .note { margin: 4px 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--note); border: 1px solid var(--note-line); color: var(--note-ink); font-size: 13px; }
      .note b { display: block; font-size: 14px; }
      .cards { display: flex; flex-direction: column; gap: 8px; }
      .card { display: flex; gap: 10px; align-items: flex-start; width: 100%; }
      .card .t { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
      .badge { font-size: 11px; font-weight: 600; color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 1px 6px; }
      .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--field); border-radius: 8px; overflow: hidden; margin-top: 8px; }
      .seg button { height: 44px; border: 0; border-right: 1px solid var(--field); background: var(--page); cursor: pointer; }
      .seg button:last-child { border-right: 0; }
      .seg button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
      .levels { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .levels div { display: flex; gap: 10px; align-items: center; }
      .chip { width: 60px; flex: none; text-align: center; border-radius: 4px; font-size: 12px; font-weight: 600; padding: 3px 0; color: #fff; }
      .switches { border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
      .switches label { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 0 12px; border-bottom: 1px solid var(--line); }
      .switches label:last-child { border-bottom: 0; }
      .switches input { width: 20px; height: 20px; accent-color: var(--accent); }
      .checks { margin-top: 12px; padding: 10px 12px; background: var(--panel); border-radius: 8px; font-size: 13px; }
      .checks .ok { color: var(--ok); } .checks .warn { color: var(--warn); } .checks .todo { color: var(--todo); }
      footer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--page); }
      footer button, footer a { flex: 1; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
      footer .primary { background: var(--accent); color: var(--on-accent); border: 0; font-weight: 600; cursor: pointer; }
      footer .save { background: var(--ok); }
      footer .primary:disabled { opacity: 0.5; cursor: default; }
      footer .link { background: transparent; border: 0; color: var(--accent); cursor: pointer; }
      .message { padding: 0 16px 8px; font-size: 13px; }
      .message.bad { color: var(--todo); } .message.good { color: var(--ok); }
      .advisory { padding: 0 16px 12px; font-size: 12px; color: var(--muted); }
      a { color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
    <script src="setup-model.js"></script>
    <script type="module" src="setup.js"></script>
  </head>
  <body>
    <nav id="back" class="back" hidden><a href="panel.html">← Under-keel details</a></nav>
    <div class="progress" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="steps"><span>1 Boat</span><span>2 Water level</span><span>3 Warnings</span></div>
    <main id="step"><p class="lead">Loading the settings…</p></main>
    <div id="message" class="message" role="status"></div>
    <footer id="nav"></footer>
    <div class="advisory">Advisory only: not for navigation. Always use an official chart.</div>
  </body>
</html>
